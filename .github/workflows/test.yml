name: Verify unified Gomoku
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:gpu
      - run: npm test
      - run: git diff --exit-code -- outputs/omok.html outputs/omok-gpu.html dist/index.html
