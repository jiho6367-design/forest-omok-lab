name: Verify unified Gomoku
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: Run CUDA checks on an available GPU runner
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gpu
      - run: npm test
        env:
          OMOK_CI_ADVISORY_GREEN_LOSS: '1'
      - name: Check adopted-model publication boundaries
        run: |
          node test/learning-publish-adoption.cjs
          node test/learning-sync-adoption.cjs
      - run: npm run test:learning:cpu
        env:
          CUDA_VISIBLE_DEVICES: ''
      - run: npm run test:learning:ui
      - run: npm run test:analysis:ui
      - run: git diff --exit-code -- outputs/omok.html dist/index.html
      - name: Advisory — 33-ply green-loss trace (non-blocking)
        id: green_loss_advisory
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OMOK_TEST_FILTER: '^new-game search traces the 33-ply green loss back through three forced blocks$'
        run: node test/unified.cjs
      - name: Record advisory result
        if: ${{ !cancelled() }}
        env:
          ADVISORY_OUTCOME: ${{ steps.green_loss_advisory.outcome }}
        run: |
          echo '### Separate advisory: 33-ply green-loss trace' >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $ADVISORY_OUTCOME. This scenario remains under investigation and does not block CI. Its assertions and failure logs are retained; this is not a playing-strength certification." >> "$GITHUB_STEP_SUMMARY"
  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.cuda
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -c "import torch; assert torch.cuda.is_available(), 'CUDA runner must provide PyTorch and a working GPU'"
      - run: npm run test:learning:cpu
